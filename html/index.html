<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  href="/sass/main.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>
    <h1> Can you beat me? </h1>
    </header>
    <section class="gameContainer">
      
        
        <div class="maxScoreContainer">
            <label for="maxScore">First one to 10 wins </label>
        </div>
        <div class="ScoreDisplay">
            <span id="player1Score">0</span> - <span id="player2Score">0</span>
        </div>

        <form class="playersContainer">
          
            <div class="ScoringButtonContainer">
              <button id="player1Button" class="ScoringButton" type="button"> Dr.Jekyll </button>
    
            <button id="player2Button" class="ScoringButton" type="button"> Mr.Hyde </button>
            </div>
       
       

        <button class="ResetButton" id="NewGame" type="button">Start Again</button>
        </form>
    
</section>

<script src="/js/main.js"> </script>

</body>
</html>
