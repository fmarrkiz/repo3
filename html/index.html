<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
    <h1> Can you beat me? </h1>
    </header>
    <section class="gameContainer">
      
        
        <div class="maxScoreContainer">
            <label for="maxScore">First to: 10 </label>
        </div>
        <div class="ScoreDisplay">
            <span id="player1Score">0</span> - <span id="player2Score">0</span>
        </div>

        <form class="playersContainer">
          
            <div class="playerSection">
              <button id="player1Button" class="ScoringButton" type="button">Player 1 (Jekyll)</button>
            </div>
           <div>
            <button id="player2Button" class="ScoringButton" type="button">Player 2 (Hyde) </button>
            </div>
       
       

        <button class="ResetButton" class="NewGamw" type="button">Start Again</button>
        </form>
    
</section>

<script src="./main.js"></script>
</body>
</html>
